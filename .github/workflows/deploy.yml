name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm install

      - name: List installed packages
        run: npm ls --depth=0

      - name: Verify vitest installation
        run: |
          echo "Checking vitest..."
          ls -la node_modules/.bin/ | grep vitest || echo "vitest not in .bin"
          which vitest || echo "vitest not in PATH"
          npx vitest --version || echo "npx vitest failed"

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
