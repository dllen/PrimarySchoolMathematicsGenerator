<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路由测试</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>小学数学题生成器 - 路由测试</h1>

  <div class="test-section">
    <h3>当前路由信息</h3>
    <div id="route-info">加载中...</div>
  </div>

  <div class="test-section">
    <h3>导航测试</h3>
    <button onclick="navigateTo('/')">首页</button>
    <button onclick="navigateTo('/generator')">题目生成器</button>
    <button onclick="navigateTo('/quick-start')">快速开始</button>
    <button onclick="navigateTo('/history')">历史记录</button>
    <button onclick="goBack()">← 返回</button>
    <button onclick="goForward()">前进 →</button>
  </div>

  <div class="test-section">
    <h3>测试日志</h3>
    <div id="test-log"></div>
  </div>

  <script>
    let logCount = 0;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('test-log');
      const timestamp = new Date().toLocaleTimeString();
      const status = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
      logDiv.innerHTML = `<div><small>${timestamp}</small> ${status} ${message}</div>` + logDiv.innerHTML;
    }

    function navigateTo(path) {
      log(`尝试导航到: ${path}`);
      if (window.app && window.app.router) {
        window.app.router.push(path);
        log(`导航成功: ${path}`, 'success');
      } else {
        log('Vue Router 未就绪', 'error');
      }
    }

    function goBack() {
      log('点击浏览器后退');
      window.history.back();
    }

    function goForward() {
      log('点击浏览器前进');
      window.history.forward();
    }

    // 监听路由变化
    if (window.app && window.app.router) {
      window.app.router.afterEach((to, from) => {
        log(`路由变化: ${from.path} → ${to.path}`, 'success');
        updateRouteInfo(to);
      });
    }

    function updateRouteInfo(route) {
      const infoDiv = document.getElementById('route-info');
      infoDiv.innerHTML = `
        <p><strong>路径:</strong> ${route.path}</p>
        <p><strong>名称:</strong> ${route.name || 'N/A'}</p>
        <p><strong>参数:</strong> ${JSON.stringify(route.params)}</p>
        <p><strong>查询:</strong> ${JSON.stringify(route.query)}</p>
      `;
    }

    // 检查 Vue 是否加载
    setTimeout(() => {
      if (window.app && window.app.router) {
        log('Vue Router 已加载', 'success');
        updateRouteInfo(window.app.router.currentRoute);
      } else {
        log('Vue Router 未加载，请确保 Vite 服务器正在运行', 'error');
      }
    }, 1000);
  </script>

  <div class="test-section">
    <h3>测试说明</h3>
    <ol>
      <li>确保 Vite 开发服务器正在运行: <code>npm run dev</code></li>
      <li>访问 http://localhost:5000</li>
      <li>点击导航按钮测试路由跳转</li>
      <li>使用浏览器后退/前进按钮测试</li>
      <li>检查控制台是否有错误</li>
    </ol>
  </div>
</body>
</html>
